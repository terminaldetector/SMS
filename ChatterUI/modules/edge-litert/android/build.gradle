// The LiteRT (Google AI Edge) engine, as a local Expo module.
//
// The distilled sources arrived as eight :edge:* Gradle library modules, which is the right shape
// for the Gallery repo and the wrong one here: `expo prebuild` regenerates ChatterUI/android/ from
// scratch, so any settings.gradle entry pointing at them is deleted on the next build. Expo
// autolinks local modules and uses this file as-is, so the sources live inside the module instead.
// EDGE_INVENTORY.md offers exactly this as the alternative ("or copy edge-distilled/ sources into
// the Triangle repo").
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.edgelitert'
version = '0.1.0'

android {
  namespace "expo.modules.edgelitert"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  // litertlm-android 0.11.0 was built with Kotlin 2.3.0; Expo SDK 55 compiles this project with
  // 2.1.0, which reads metadata only up to 2.2.0 — every reference to a litertlm class is an error
  // without this. The alternative was raising the whole project's Kotlin version, which would
  // recompile React Native and every Expo module to gain one engine; this stays inside this module.
  //
  // The flag is safe for what is used here — data classes, enums, interfaces and suspend functions,
  // whose metadata shape has not changed between 2.1 and 2.3. It is NOT a general licence: if
  // litertlm later exposes something the older compiler cannot model, this becomes a link error at
  // runtime rather than a compile error, and the fix then is a matching Kotlin version.
  kotlinOptions {
    freeCompilerArgs += "-Xskip-metadata-version-check"
  }

  // litertlm ships prebuilt .so files; two copies of libLiteRt.so is a packaging failure, which is
  // why com.google.ai.edge.litert:litert must NOT also be added (EDGE_INVENTORY.md, conflicts).
  packagingOptions {
    pickFirst '**/libc++_shared.so'
  }
}

dependencies {
  implementation 'com.google.ai.edge.litertlm:litertlm-android:0.11.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation 'com.google.code.gson:gson:2.11.0'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
  // Optional AICore path (Model.runtimeHelper routes LITERT_LM vs AICORE). Package-allowlisted by
  // Google, so it is inert on most devices — kept so the fork's behaviour is not silently reduced.
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'
}
