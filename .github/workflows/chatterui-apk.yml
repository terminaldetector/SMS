# Build the ChatterUI + HELIX mesh-mod APK (the vendored app lives in ./ChatterUI).
# GitHub runners have the Android SDK + full internet.
#
# cui-llama.rn is now forks/cui-llama.rn-rpc (ChatterUI/package.json -> file:../forks/cui-llama.rn-rpc),
# an RPC-enabled fork (HELIX Level 3 / Option A — see forks/cui-llama.rn-rpc/RPC_FORK_NOTES.md), so
# this compiles llama.cpp FROM SOURCE with -DLM_GGML_USE_RPC (rnllamaBuildFromSource=true) instead of
# using prebuilt native libs — that's why this workflow is slower than a stock ChatterUI build and why
# the fork's own JS/TS (lib/) must be built here before ChatterUI's npm install can resolve it.
#
# Builds assembleRelease by default: a RELEASE APK EMBEDS the JS bundle and runs standalone. A debug
# APK does NOT bundle JS (it needs a Metro dev server) — installed on a phone it hangs on the splash.
# Expo's android template signs release with the debug key, so no signing secrets are needed.
# Actions -> "ChatterUI APK" -> Run workflow -> download the artifact.

name: ChatterUI APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Gradle variant (release embeds JS + runs standalone; debug needs Metro)'
        type: choice
        default: assembleRelease
        options: [assembleRelease, assembleDebug]
  push:
    # forks/** matters as much as ChatterUI/**: cui-llama.rn resolves to forks/cui-llama.rn-rpc, so
    # its C++, its lib/ and its package.json are all inputs to this APK. Without it, a fix that
    # touches only the fork silently produces no build at all.
    paths: ['ChatterUI/**', 'forks/**', '.github/workflows/chatterui-apk.yml']

defaults:
  run:
    working-directory: ChatterUI

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # NDK 27.3.13750724 matches the version build_cuillama_rpc_fork.yaml already proved green
      # (compiles + links the RPC backend for forks/cui-llama.rn-rpc) — keep these in sync.
      - name: Install Android platform + NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ChatterUI/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # Build the fork's own JS/TS output (lib/) — it's gitignored (rebuilt on publish normally),
      # but ChatterUI/package.json points at it directly via file:, and its package.json main/types
      # fields point at lib/, so ChatterUI's npm install can't resolve the module without this.
      # --ignore-scripts skips its postinstall (downloads prebuilt non-RPC .so's we don't want here).
      #
      # The node_modules this needs MUST then be deleted. node_modules/cui-llama.rn is a symlink, so
      # Metro resolves the fork's imports from its real path — and the fork's devDependencies pull
      # in their own React Native (0.72). Bundling a second React Native is fatal: cui-llama.rn gets
      # its TurboModuleRegistry from an instance the app never initialised, so
      # TurboModuleRegistry.get('RNLlama') is null and every native call fails with
      # "Cannot read property 'install' of null". metro.config.js also blocks this directory, so the
      # two defences are independent.
      - name: Build cui-llama.rn RPC fork's JS/TS output
        working-directory: forks/cui-llama.rn-rpc
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
          rm -rf node_modules

      - name: Install JS dependencies
        env:
          RNLLAMA_SKIP_POSTINSTALL: '1'
        run: npm install   # patch-package postinstall; installs @noble/*, react-native-tcp-socket, etc.

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --clean

      # rnllamaBuildFromSource=true compiles llama.cpp (incl. the vendored ggml-rpc backend) instead
      # of using cui-llama.rn's prebuilt (non-RPC) jniLibs; arm64-v8a covers effectively all modern
      # Android phones and keeps from-source compile time reasonable (matches the fork's own CI).
      - name: Gradle build
        working-directory: ChatterUI/android
        run: |
          ./gradlew ${{ github.event.inputs.variant || 'assembleRelease' }} \
            -PrnllamaBuildFromSource=true -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: echo "path=$(find android/app/build/outputs/apk -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatterui-helix-apk
          path: ChatterUI/${{ steps.apk.outputs.path }}
          if-no-files-found: error
